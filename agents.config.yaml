# How many PDS1 agents may run at once. Owner decision D-0018 (2026-11-04).
# Adjust these numbers as needed. pds1-delivery-lead schedules by this file,
# never by a number written in the docs. Change it by PR, logged on the D-0018 issue.

long_work:
  # Building a component, a design, a migration, a release.
  max_running: 8
  # A long-work session idle this long (minutes, from its activity record) whose lane is empty is stopped; it starts
  # again when work arrives. Below the nudge interval, or the nudge's wake-up would keep every session alive (#769).
  idle_exit_min: 5
  # Of max_running, this many are kept for roles with gate: true (verify, locale, docs, release); others never take them.
  reserved_gate_slots: 2

coordinators:
  # Always running; they don't use long-work slots. D-0173 (owner, 2026-11-11): one always-on PM; every other role,
  # the Delivery Lead included, starts when it has work and stops when its lane is empty.
  roles: [pds1-product-lead]

models:
  # D-0173 (owner, 2026-11-11): the PM picks the model for each task from its complexity, risk, scope and ambiguity,
  # and records it on the issue as a label: model:haiku (small, predictable), model:sonnet (normal implementation and
  # debugging), model:opus (architecture, hard problems, high risk). No label: the role definition's model.
  # The scheduler starts a session on the model of the task it will take next. A running session is kept for its next
  # task only when that task needs the same model; otherwise, once it has been idle long_work.idle_exit_min, it is
  # restarted on the next task's model (on_change: restart). A model is never switched under a working session.
  label_prefix: "model:"
  allowed: [haiku, sonnet, opus]
  on_change: restart

small_tasks:
  # A code review, a lint or typo fix, one test, triaging an issue, a GitHub
  # reply, the daily summary. Run on top of the long-work slots.
  max_running: unlimited       # or a number
  max_minutes: 15              # longer -> stop and queue for a long-work slot

memory:
  # Memory sets the real limit, not the agent count (VM 131 has 15 GB).
  per_agent_limit_gb: 2.5      # each session's own limit (systemd MemoryMax)
  start_new_below_free_gb: 2   # new small tasks wait while free memory is below this

dispatch:
  # The poller (team.sh nudge, deploy/agents/pds1-nudge.timer) runs every heartbeat_min minutes and rewrites the pinned
  # heartbeat issue (template v2.4 §6.1; #772). The poller was stopped at the PDS2 cutover (D-0175) and the hourly
  # watchdog that read the heartbeat was retired (#1312). Check 15 still compares the timer with heartbeat_min.
  heartbeat_min: 10
  heartbeat_issue: 809

# The role registry (template v2.4 §5.1, D-0084; #768): the one list of roles. team.sh, the scheduler, pickup and CI
# (checks 13 and 15) read it, nothing else lists roles. Keys: id, title (the session name "PDS1 · <title>"; "PDS1 - PM" for the Product Lead, the project contact, so it sorts first), kind
# (lane | task), label (the work-item label), instances, parked (never started), boot (started by team.sh start-core),
# definition (the agent file), wakes_on (issue_opened | issue_labeled | comment_mention | ci_failed | heartbeat) and an
# optional memory_limit_gb (default: memory.per_agent_limit_gb), priority (release > integrate > verify > build > design
# > spec > evergreen; the start order when slots are scarce) and gate (may use long_work.reserved_gate_slots; #769). The Delivery Lead fixes the keys as a decision.
roles:
  - id: product-lead
    title: "Product Lead"
    priority: spec
    gate: false
    kind: lane
    label: "agent:pds1-product-lead"
    instances: 1
    parked: false
    boot: true
    definition: .claude/agents/pds1-product-lead.md
    wakes_on: [issue_opened, issue_labeled, comment_mention, ci_failed, heartbeat]
