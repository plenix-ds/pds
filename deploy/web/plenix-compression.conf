# Compression for the Plenix sites on the web host (#1188). deploy/web/enable-compression.sh installs this file as
# /etc/nginx/snippets/plenix-compression.conf and includes it in both server blocks of /etc/nginx/sites-available/plenix.
# - Brotli when the browser offers it (all supported browsers do over HTTPS), else gzip.
# - Compressed on the fly: no file is added to a published /cdn/<version>/ folder, so published versions stay as they are.
# - Quality 5 and gzip level 6 (was 1): plenix.js goes from 777 KB (gzip 1) to about 553 KB (brotli 5) on the wire.
# - Vary: Accept-Encoding, so the reverse proxy never hands a brotli body to a browser that asked for gzip.
gzip on;
gzip_vary on;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_types text/css text/javascript application/javascript application/json image/svg+xml text/plain;
brotli on;
brotli_comp_level 5;
brotli_min_length 1024;
brotli_types text/css text/javascript application/javascript application/json image/svg+xml text/plain;
