name: UI/UX
description: Feedback on how something looks or behaves. Goes to Design Audit, then a Component Engineer.
title: "UI/UX: "
labels: ["type:ui", "agent:pds1-product-lead"]
body:
  - type: textarea
    id: what
    attributes:
      label: What should change?
      description: Plain words are enough. Paste a screenshot or annotated picture if it helps. Say "show me options" or "send a before/after" if you want pictures back.
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Where (component, page or link)
    validations:
      required: false
