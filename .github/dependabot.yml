# Dependency watch (issue 696, audit finding #684). Dependabot opens a pull request for a new version of an npm package and of a
# GitHub Action, once a week. It reads package.json and the workflows only: the libraries copied into platform/vendor/ (React,
# Tiptap, PDF.js, ECharts) are not npm dependencies, so they are not watched here (see platform/vendor/README.md).
# It uses GitHub's own token; nothing is stored. Settings are not changed by this file.
# Its pull requests target styling/phase-2, the branch work merges into (main moves only at a release). Major updates of
# the React type packages are ignored: Plenix ships React 18 (platform/vendor/), so React 19 typings do not apply.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: styling/phase-2
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
    ignore:
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react-dom"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    target-branch: styling/phase-2
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
