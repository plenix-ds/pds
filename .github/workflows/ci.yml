# PDS 1.0 CI (plan §7 "Final CI stack"; issue #197). Required on main through branch protection and the merge queue.
# Only new problems block: each check runs on the PR's head and on its base (the merge base with main) and fails only on
# findings the head adds (tools/ci/new-problems.mjs). Old debt is counted in the job summary but does not block.
# Rules: every action pinned to a commit SHA, zizmor clean, every run step in bash with pipefail, no stored secrets.
# A skipped or cancelled check counts as a failure in the "CI result" job, the one stable required check.
name: CI

on:
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  zizmor:
    name: Workflows (zizmor)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: zizmor, pinned, offline (no findings allowed)
        run: pipx run zizmor==1.32.0 --offline --format=github .github/workflows

  decisions:
    name: Decisions (decisions.yaml)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # the dashboard's own YAML parser (dashboard.yml): text it cannot read fails here, not on the live dashboard (#589)
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: PyYAML, as the dashboard pins it
        shell: bash
        run: python -m pip install --disable-pip-version-check -q 'PyYAML==6.0.2'
      - name: Self-test (the three YAML breaks of #585 fail, a valid file passes)
        shell: bash
        run: node tools/ci/check-decisions.test.mjs
      - name: Valid YAML; unique ids; every entry has a check; past entries never rewritten
        shell: bash
        run: node tools/ci/check-decisions.mjs "$(git merge-base "$BASE_SHA" HEAD)"
      - name: ADR index self-test (#956)
        shell: bash
        run: node tools/ci/adr-index.test.mjs
      - name: ADR files well-formed; the index is generated, never committed (#956)
        shell: bash
        run: node tools/ci/adr-index.mjs --check

  process:
    name: Process checks 13, 15 and 16, launch test (role registry, settings, workflows; #768, #772)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # the registry is read with PyYAML, as the dashboard and the decisions check read their YAML (#589)
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: PyYAML, as the dashboard pins it
        run: python -m pip install --disable-pip-version-check -q 'PyYAML==6.0.2'
      - name: Self-test (checks 13 and 15; the capacity rules, #769; the nudge never sleeps on open work, #895)
        run: |
          node tools/ci/check-roles.test.mjs
          node tools/ci/capacity.test.mjs
          node tools/ci/dispatch.test.mjs
          node tools/ci/check-workflows.test.mjs
      - name: Check 13, every role has a definition, label and trigger
        run: node tools/ci/check-roles.mjs
      - name: Check 15, no document states a setting that differs from agents.config.yaml
        run: node tools/ci/check-settings-prose.mjs
      - name: Check 16, required workflows run in the merge queue; no hand-off with GITHUB_TOKEN
        run: node tools/ci/check-workflows.mjs
      - name: G0 launch test, every active role through team.sh start once (dry run, starts nothing)
        run: |
          mkdir -p "$HOME/pds1"
          PDS1_CFG="$PWD/agents.config.yaml" bash deploy/agents/team.sh launch-test

  rulesync:
    name: Rulesync drift (CLAUDE.md, AGENTS.md)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Generated instructions equal .rulesync/ (rulesync pinned; edit .rulesync/rules, then generate)
        run: npx -y rulesync@43.2.0 generate --check

  generated:
    name: Generated files (none committed; library block current)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: No build output is committed (a tracked file that .gitignore excludes; #60)
        run: |
          tracked=$(git ls-files -ci --exclude-standard)
          if [ -n "$tracked" ]; then
            echo "::error::These files are build outputs (.gitignore) but are committed; remove them with git rm --cached:"
            echo "$tracked"
            exit 1
          fi
          echo "no build output committed"
      - name: The library block of platform/index.ts and platform.css equals build-exports.js (#60)
        run: |
          node build-exports.js
          if ! git diff --exit-code -- platform/index.ts platform/platform.css; then
            echo "::error::The library block is stale: run node build-exports.js and commit platform/index.ts and platform/platform.css"
            exit 1
          fi

  trace:
    name: Traceability (acceptance IDs in tests and evidence)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Each AC-n of a slice this PR implements is in its tests and its evidence (plan §7)
        run: node tools/ci/check-trace.mjs "$(git merge-base "$BASE_SHA" HEAD)"
      # a version PR leaves no changelog fragment behind: in the merge queue, one merged ahead of it is in this head (#884)
      - name: Release notes, a version change leaves no changelog fragment unfolded (#884)
        run: |
          node tools/ci/check-release-notes.test.mjs
          node tools/ci/check-release-notes.mjs "$(git merge-base "$BASE_SHA" HEAD)"

  design-checks:
    name: Checks 9-12 (state manifest, numeric columns, pill height, visual regression)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Install and build
        run: npm ci --no-audit --no-fund
      - name: Check 9, state manifest (diff-aware)
        run: node tools/checks/states/states.mjs "$(git merge-base "$BASE_SHA" HEAD)"
      - name: Check 10, numeric columns
        run: node tools/checks/numeric/numeric.mjs
      - name: Locale checks (diff-aware; G6; only findings the PR adds fail, missing Arabic is reported and never blocks)
        shell: bash
        run: node tools/checks/locale/locale.mjs "$(git merge-base "$BASE_SHA" HEAD)"
      - name: The checks' own unit tests (Vitest)
        run: npx --no-install vitest run tools/checks
      - name: Check 11, pill height (Playwright, the runner's Chrome; a missing browser fails)
        run: |
          command -v google-chrome >/dev/null || { echo "::error::Chrome is missing on the runner: check 11 cannot run, and a missing browser is a FAIL"; exit 1; }
          google-chrome --version
          npx --no-install playwright test -c tests/pills/playwright.config.mjs
      - name: Check 12, visual regression (1366×768 and 1920×1080 in light and dark, RTL and compact for changed components; 1024×640 light; #191, D-0092)
        run: |
          VISUAL_EXTRA=$(node tools/ci/visual-extra.mjs "$(git merge-base "$BASE_SHA" HEAD)")
          export VISUAL_EXTRA
          echo "RTL and compact for: ${VISUAL_EXTRA:-none}"
          npx --no-install playwright test -c tests/visual/playwright.config.mjs
      - name: Check 12 report and differences (for the PR and the dashboard; D-0016)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-regression
          # Playwright writes its output beside its config (tests/visual/test-results: visual.json and any diff images).
          # baselines/ carries any baseline the run wrote because it was missing (a new specimen or screen size): commit
          # those from the artifact, never from a local machine (D-0092, #857)
          path: |
            tests/visual/test-results/
            tests/visual/baselines/
          if-no-files-found: ignore
          retention-days: 90
      - name: Dashboard acceptance tests (#195 AC-1 to AC-6), when the dashboard or its tests change
        run: |
          if git diff --quiet "$(git merge-base "$BASE_SHA" HEAD)" HEAD -- dashboard/pds1 tests/dashboard; then
            echo "dashboard/pds1 and tests/dashboard unchanged: not run for this PR"
          else
            npx --no-install playwright test -c tests/dashboard/playwright.config.mjs
          fi

  checks:
    name: New problems (${{ matrix.tool }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        tool: [tsc, eslint, stylelint, knip, system, style, types, opengrep]
    env:
      TOOL: ${{ matrix.tool }}
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Head, install and build
        if: matrix.tool != 'opengrep'
        run: npm ci --no-audit --no-fund

      - name: Opengrep 1.33.0, pinned by sha256 (signed by opengrep's release workflow; verified 2026-11-05, #197)
        if: matrix.tool == 'opengrep'
        env:
          OPENGREP_SHA256: 2545812755572e1355ea60f96288f82a26eebed7fc8b512430d49d5667214c24
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL -o "$RUNNER_TEMP/bin/opengrep" https://github.com/opengrep/opengrep/releases/download/v1.33.0/opengrep_manylinux_x86
          echo "$OPENGREP_SHA256  $RUNNER_TEMP/bin/opengrep" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/bin/opengrep"
          echo "OPENGREP_BIN=$RUNNER_TEMP/bin/opengrep" >> "$GITHUB_ENV"
          echo "OPENGREP_RULES=$GITHUB_WORKSPACE/.opengrep/rules/pds.yml" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/bin/opengrep" test .opengrep/rules

      - name: Head, findings
        run: node tools/ci/new-problems.mjs run "$TOOL" "$RUNNER_TEMP/head.json"

      - name: Base, install and build (merge base with the target branch)
        run: |
          set -euo pipefail
          [ -n "$BASE_SHA" ] || { echo "No base commit for this event"; exit 1; }
          merge_base=$(git merge-base "$BASE_SHA" HEAD)
          echo "Base: $merge_base"
          git worktree add --detach "$RUNNER_TEMP/base" "$merge_base"
          cd "$RUNNER_TEMP/base"
          if [ "$TOOL" != opengrep ]; then npm ci --no-audit --no-fund; fi

      - name: Base, findings (the head's runner, the base's code and config)
        working-directory: ${{ runner.temp }}/base
        run: node "$GITHUB_WORKSPACE/tools/ci/new-problems.mjs" run "$TOOL" "$RUNNER_TEMP/base.json"

      - name: Compare (fail on new problems only)
        run: node tools/ci/new-problems.mjs compare "$TOOL" "$RUNNER_TEMP/base.json" "$RUNNER_TEMP/head.json"

  zero-overlap:
    name: Zero overlap (computed-style snapshot, diff-aware)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # runs only when the styling, the test, its fixtures or its snapshot changed (#46); otherwise it passes without running
      - name: Did anything the test reads change?
        id: scope
        run: |
          if git diff --quiet "$(git merge-base "$BASE_SHA" HEAD)" HEAD -- platform build-app.js .github/workflows/ci.yml tests/zero-overlap.test.js tests/clash-audit.js tests/lib.js tests/fixtures/zero-overlap tests/baselines/pilot-computed.json; then
            echo "run=no" >> "$GITHUB_OUTPUT"
            echo "styling, test, fixtures and snapshot unchanged: not run for this PR"
          else
            echo "run=yes" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.scope.outputs.run == 'yes'
        with:
          node-version: 22
          cache: npm
      - name: Install and build
        if: steps.scope.outputs.run == 'yes'
        run: |
          npm ci --no-audit --no-fund
          node build-app.js
      - name: Zero overlap (Chrome; a missing browser fails)
        if: steps.scope.outputs.run == 'yes'
        run: |
          command -v google-chrome >/dev/null || { echo "::error::Chrome is missing on the runner: zero-overlap cannot run, and a missing browser is a FAIL"; exit 1; }
          CHROME_PATH="$(command -v google-chrome)" node tests/zero-overlap.test.js

  result:
    name: CI result
    if: always()
    needs: [zizmor, decisions, process, rulesync, generated, trace, design-checks, zero-overlap, checks]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every check passed (skipped or cancelled is a failure)
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          bad=$(echo "$RESULTS" | jq -r '[to_entries[] | select(.value.result != "success")] | length')
          [ "$bad" = 0 ] || { echo "::error::$bad check(s) did not succeed"; exit 1; }
