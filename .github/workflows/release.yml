# PDS release (P0-12, #194; plan §7c; D-0003). Two jobs:
# - dry-run (pull requests, by hand): every step of a release except the writes, and proves the safety checks.
# - publish (a pushed tag vX.Y.Z, after the CDN and API went live from the host-side deploy; #312): checks the tag is
#   package.json's version on main, builds, checks the live CDN serves this build with SHA256SUMS, version.json and
#   latest.json -> this version, then publishes the four @plenix-ds packages and the GitHub release. It is the only job
#   with write permissions (packages, contents), and holds no deploy key: the web host is reached by the deploy step.
#
# What the dry run does, on a throwaway version <package.json version>-dryrun.<run number> so nothing collides:
#   build (npm ci builds; release:build steps) -> one version everywhere + CDN immutability (tools/publish/preflight.mjs)
#   -> bundle budgets (check-bundle.js) -> no remote addresses in the shipped scripts (tools/publish/no-remote-code.mjs) -> SHA256SUMS + version.json (tools/publish/manifest.mjs, verified with sha256sum -c)
#   -> next latest.json with every field and the pins kept (tools/publish/latest.mjs, against the live file)
#   -> npm publish --dry-run of the four packages -> negative proof: the current version is refused as already published
#   -> the live CDN check (tools/check-live-cdn.js, sampled) still works against the live release
#   -> the connected apps' drift report (tools/baseline/drift.mjs, read-only; never fails the release; #114).
name: Release (dry run)

on:
  push:
    tags: ['v*.*.*']
  pull_request:
    paths:
      - 'tools/publish/**'
      - '.github/workflows/release.yml'
      - 'build-packages.js'
      - 'build-packages.d/**'
      - 'tools/baseline/**'
      - 'platform/vendor/**'
  workflow_dispatch:
  # every day on main: the bundle budgets and every release check stay green between releases. A PR that doesn't
  # touch the release files skips the dry run, so a budget overrun could reach main unseen (#84 -> #383)
  schedule:
    - cron: '30 3 * * *'

permissions: {}

concurrency:
  group: release-dry-run-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  dry-run:
    name: Release dry run (npm + CDN + API)
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    env:
      CDN: https://design-system.lighthouseway.org/cdn/
      RUN_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          # no dependency cache in a publishing workflow: a poisoned cache could reach a published package (zizmor)
          package-manager-cache: false
          registry-url: https://npm.pkg.github.com
          scope: '@plenix-ds'

      - name: Versions (the real one, the throwaway dry-run one, the planned next one)
        id: v
        run: |
          base=$(node -p "require('./package.json').version")
          next=$(node -p "const [a,b,c]=process.argv[1].split('.').map(Number); [a,b,c+1].join('.')" "$base")
          dry="${next}-dryrun.${RUN_NUMBER}"
          echo "base=$base" >> "$GITHUB_OUTPUT"; echo "next=$next" >> "$GITHUB_OUTPUT"; echo "dry=$dry" >> "$GITHUB_OUTPUT"
          echo "Released: $base · planned next: $next · this dry run builds: $dry"

      - name: Set the dry-run version everywhere (root, workspaces, their references, lockfile; offline)
        env:
          DRY: ${{ steps.v.outputs.dry }}
        run: node tools/publish/set-version.mjs "$DRY"

      - name: Install and build (npm ci runs build-app.js)
        run: npm ci --no-audit --no-fund

      - name: Release build (build-usage, system and style checks, packages, CDN, API)
        run: |
          node build-usage.js
          node check-system.js
          node check-style.js
          node build-packages.js

      - name: Preflight, one version everywhere and CDN immutability
        env:
          DRY: ${{ steps.v.outputs.dry }}
        run: node tools/publish/preflight.mjs "$DRY" --cdn "$CDN"

      - name: Bundle-size budgets
        run: node check-bundle.js

      - name: Vendored engine budget, ECharts at most 230 KB gzipped (past it, split into a shared core plus kind files; #106)
        run: |
          f=platform/vendor/echarts/echarts.min.js
          gz=$(gzip -9 -c "$f" | wc -c)
          echo "echarts.min.js: $(wc -c < "$f") bytes, $gz gzipped (budget 235520)"
          [ "$gz" -le 235520 ] || { echo "VENDOR_BUDGET_FAIL: echarts.min.js is $gz bytes gzipped, over 230 KB: split it into a shared core plus kind files (esbuild ESM splitting; #106)"; exit 1; }

      - name: Per-part styles on the CDN and in the archive, equal to @plenix-ds/styles (#151)
        env:
          DRY: ${{ steps.v.outputs.dry }}
        run: |
          cdn="release/cdn/$DRY"
          test -f "$cdn/foundations.css" || { echo "PARTS_FAIL: $cdn/foundations.css is missing"; exit 1; }
          test -d "$cdn/parts" || { echo "PARTS_FAIL: $cdn/parts/ is missing"; exit 1; }
          diff -rq release/packages/styles/parts "$cdn/parts"
          cmp release/packages/styles/foundations.css "$cdn/foundations.css"
          listed=$(tar -tzf "$cdn/plenix-$DRY.tgz" | grep -cE '^(foundations\.css|parts/.+\.css)$')
          want=$(( $(find "$cdn/parts" -name '*.css' | wc -l) + 1 ))
          [ "$listed" = "$want" ] || { echo "PARTS_FAIL: the archive has $listed of $want part files"; exit 1; }
          echo "PARTS_OK: foundations.css + $((want - 1)) parts on the CDN and in the archive, equal to @plenix-ds/styles"

      - name: No remote addresses in the shipped scripts (MV3 extensions; #150)
        env:
          DRY: ${{ steps.v.outputs.dry }}
        run: |
          shopt -s nullglob
          node tools/publish/no-remote-code.mjs "release/cdn/$DRY"/*.js release/packages/react/*.js release/packages/react/*.mjs release/packages/react/*.cjs

      - name: SHA256SUMS and version.json, verified
        env:
          DRY: ${{ steps.v.outputs.dry }}
        run: |
          node tools/publish/manifest.mjs "$DRY" --commit "$GITHUB_SHA"
          (cd "release/cdn/$DRY" && sha256sum --quiet -c SHA256SUMS)
          echo "sha256sum -c: every listed file verified"

      - name: Next latest.json (every field and the pins kept), against the live file
        env:
          NEXT: ${{ steps.v.outputs.next }}
        run: node tools/publish/latest.mjs "$NEXT" --current "${CDN}latest.json" --out "$RUNNER_TEMP/latest.next.json"

      - name: npm publish --dry-run (the four @plenix-ds packages)
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: |
          for p in tokens icons styles react; do
            echo "::group::@plenix-ds/$p"
            (cd "release/packages/$p" && npm publish --dry-run)
            echo "::endgroup::"
          done

      - name: Connected apps against this build (read-only drift report; never fails the release; #114)
        run: node tools/baseline/drift.mjs --out "$RUNNER_TEMP/drift"

      - name: Negative proof, the live latest version is refused as already published
        run: |
          live=$(curl -fsS "${CDN}latest.json" | node -e 'console.log(JSON.parse(require("fs").readFileSync(0)).latest)')
          echo "LIVE=$live" >> "$GITHUB_ENV"
          node tools/publish/preflight.mjs "$live" --cdn "$CDN" --expect-published

      - name: The live CDN check still works (live latest version, sampled)
        run: node tools/check-live-cdn.js "$LIVE" --live-only --sample 20 --deadline 8

      - name: Summary
        env:
          DRY: ${{ steps.v.outputs.dry }}
          NEXT: ${{ steps.v.outputs.next }}
        run: |
          mkdir -p "$RUNNER_TEMP/records"
          cp "release/cdn/$DRY/version.json" "release/cdn/$DRY/SHA256SUMS" "$RUNNER_TEMP/latest.next.json" "$RUNNER_TEMP/records/"
          cp -r "$RUNNER_TEMP/drift" "$RUNNER_TEMP/records/drift"
          {
            echo "### Release dry run: $DRY"
            echo
            echo "Nothing was published (owner hold, 2026-10-29). Planned next release: **$NEXT**."
            echo
            echo '```json'; cat "release/cdn/$DRY/version.json"; echo '```'
            echo
            echo "Next \`latest.json\`:"; echo '```json'; cat "$RUNNER_TEMP/latest.next.json"; echo '```'
            echo; cat "$RUNNER_TEMP/drift/drift.md"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-dry-run-records
          path: ${{ runner.temp }}/records
          retention-days: 30

  publish:
    name: Publish npm + GitHub release (tag)
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      packages: write
    env:
      TAG: ${{ github.ref_name }}
      CDN: https://design-system.lighthouseway.org/cdn/
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: The tag is package.json's version, on main, not released yet
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(node -p "require('./package.json').version")
          [ "v$v" = "$TAG" ] || { echo "Tag $TAG does not match package.json $v"; exit 1; }
          git merge-base --is-ancestor HEAD origin/main || { echo "$TAG is not on main"; exit 1; }
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then echo "$TAG already has a GitHub release"; exit 1; fi
          echo "VERSION=$v" >> "$GITHUB_ENV"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
          registry-url: https://npm.pkg.github.com
          scope: '@plenix-ds'

      - name: Install and build
        run: |
          npm ci --no-audit --no-fund
          node build-usage.js
          node check-system.js
          node check-style.js
          node build-packages.js

      - name: One version everywhere (the CDN is expected to have it already)
        run: node tools/publish/preflight.mjs "$VERSION" --cdn "$CDN" --expect-published

      - name: The live CDN serves this build, with SHA256SUMS, version.json and latest.json
        run: |
          node tools/check-live-cdn.js "$VERSION" --dir "release/cdn/$VERSION" --sample 60 --deadline 15
          curl -fsS "${CDN}${VERSION}/version.json" | node -e 'const j=JSON.parse(require("fs").readFileSync(0));if(j.version!==process.argv[1])throw new Error("version.json says "+j.version);console.log("version.json:",j.version,j.files,"files")' "$VERSION"
          curl -fsS -o /dev/null "${CDN}${VERSION}/SHA256SUMS"
          curl -fsS "${CDN}latest.json" | node -e 'const j=JSON.parse(require("fs").readFileSync(0));if(!j.pins||typeof j.pins!=="object")throw new Error("latest.json lost pins");console.log("latest.json:",JSON.stringify(j))'

      - name: Publish the four packages to GitHub Packages
        env:
          # GitHub Packages has no trusted (OIDC) publishing; the run's own token, packages: write, this job only
          NODE_AUTH_TOKEN: ${{ github.token }} # zizmor: ignore[use-trusted-publishing]
        run: |
          for p in tokens icons styles react; do
            (cd "release/packages/$p" && npm publish)
          done

      - name: GitHub release, notes from CHANGELOG.md
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          awk -v h="## [$VERSION]" 'index($0, h) == 1 {on=1; next} on && index($0, "## [") == 1 {exit} on {print}' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          [ -s "$RUNNER_TEMP/notes.md" ] || { echo "CHANGELOG.md has no section for $VERSION"; exit 1; }
          printf '\n---\nPackages: @plenix-ds/tokens, icons, styles, react %s · CDN: %s%s/ (SHA256SUMS, version.json) · API: https://design-system.lighthouseway.org/api/v1/ · Design spec (each component page): https://design-system.lighthouseway.org/ (#114)\n' "$VERSION" "$CDN" "$VERSION" >> "$RUNNER_TEMP/notes.md"
          gh release create "$TAG" -R "$GITHUB_REPOSITORY" --verify-tag --title "Plenix $TAG" --notes-file "$RUNNER_TEMP/notes.md"
