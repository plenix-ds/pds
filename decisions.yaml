- id: D-0088
  date: 2026-11-06
  area: api
  decided_by: agent (pds1-ds-architect) on #800 (G3), owner may switch
  decision: 'DataGrid column fit (D-0087) adds no prop, kind or token. The selection checkbox column keeps --plx-comp-data-grid-lead-column-width, and the row menu (⋮) column keeps --plx-comp-data-grid-row-menu-width (both existing, with their touch values). long_text_threshold is an engine constant, LONG_TEXT_CHARS = 40 in platform/components/DataGrid/engine/useGridMetrics.ts: a text column whose widest value in view is longer than 40 characters is long text. kind "wrap" and url columns are long text whatever their length. Check 10 keeps tabular-nums and no longer requires text-align:end.'
  why: 'A character count is not a CSS value and is not themed, so it is not a token. The design adds no prop (G2, #804). The two widths already exist. 40 characters holds the compact values of the owner''s case grid (reasons and statuses, under 30) and puts a sentence (a summary or a note) into long text.'
  options: ['A - existing tokens plus an engine constant of 40 (chosen)', 'B - a public prop longTextThreshold on DataGrid', 'C - a comp token with a webOnly number']
  status: active
  check: tools/checks/numeric/numeric.mjs (check 10, tabular-nums only); the #800 behaviour tests AC-1 to AC-8 for the threshold; G3 on the build PR (no new prop or token)

- id: D-0089
  date: 2026-11-06
  area: api
  decided_by: agent (pds1-ds-architect) on #61 and #818 (G3), owner may switch
  decision: 'Plenix''s source under platform/ is TypeScript except the files listed as allowed in platform/standards/js-source.json, each with its reason: dev page scripts, theme-boot, the loader, the engines copy, the two CommonJS icon files and the generated icon inventory, and the en/ar catalogs. platform/design-system, vendor, dist and mobile are outside the rule. Files still to convert are listed as pending, which includes wave 5 (index.js and the exports lists). allowJs stays on for the allowed files (docs/adr/0011, closing addendum).'
  why: 'The wave 4 rulings (#818) show readers that need these files as JavaScript (a plain script tag, a verbatim copy, CommonJS, a generated file, the protected catalog). A listed exception with its reason, plus a check, keeps the rest from drifting back to JavaScript.'
  options: ['A - an allowed list with reasons plus a check (chosen)', 'B - convert everything and add build steps for script tags and CommonJS readers', 'C - no check, the review only']
  status: active
  check: check-system.rules/js-source.js (check-system rule js-source)

- id: D-0087
  date: 2026-11-06
  area: components
  decided_by: owner (chat, 2026-11-06, plenix-ds/pds#800)
  decision: 'DataGrid column sizing: from the grid''s current width and its visible columns, compact columns (numbers, IDs, dates, names, people, status and pills) take the width of their widest item, with an app''s set width as a minimum, never a cap; spare room is shared evenly across the columns and content stays left-aligned; only long text (summary, description) may truncate. The first column, when it is the selection checkbox, is a fixed static width. The last column, when it holds actions, shows them as icon-only buttons, right-aligned, on row hover when the grid has room, and otherwise is a fixed ⋮ menu pinned to the right edge.'
  why: 'Owner, 2026-11-06: columns truncated with lots of space left ("this issue is really bothering me"); he set the rule himself.'
  options: ['the owner''s rule (chosen)']
  status: active
  check: 'planned:data-grid-column-fit (behaviour tests AC-1 to AC-8 in docs/pds1/slices/800-column-fit/brief.md)'

- id: D-0090
  date: 2026-11-06
  area: api
  decided_by: agent (pds1-ds-architect) on #800 (G3, AC-5), on the Design Director's design (#836); owner may switch
  decision: 'DataGrid''s hover row actions (D-0087) come from rowMenu. The items with an icon that are not danger show inline, at most three, and the rest stay in ⋮. DataGridMenuAction gains one optional field, inline?: boolean: false keeps an item in ⋮, and true shows it inline when it has an icon. A danger item is never inline, whatever inline says: it stays in ⋮ after its divider. No new DataGrid prop (docs/adr/0022).'
  why: 'The override sits beside the item it is about, and the default needs no code from an app. A second rowActions list would duplicate the menu and drift.'
  options: ['A - inline?: boolean on the menu item (chosen)', 'B - a rowActions prop', 'C - no override']
  status: active
  check: 'G3 on the AC-5 build PR (only inline?: boolean added; CI types check); the AC-5 behaviour tests'
