decision: 'Region loading API (ADR 0042, adopting G2 design.md §2): Spinner gains labelPosition "hidden" (default) | "after" | "below" and delay number | "region"; the region helper is a named export LoadingState (label, progress, size default lg, labelPosition default after, delay default region; outermost-only nesting); DataGrid.loading and ListingPage.loading are new; tokens ref motion-delay-loading-region 1 s -> sys motion-loading-region-delay, comp spinner-label-{gap,text,font-size,line-height}. EntityTitle, MetricCard and DataGrid stop using Skeleton; Skeleton stays opt-in, not deprecated.'
why: 'The owner wants a labeled spinner after about 1 s, not skeleton bars (#1032, D-0130); a named export (the EmptyState sibling) tree-shakes and has its own type, unlike a Spinner.Region static, and keeps the inline ring free of a region flag.'
options: ['LoadingState named export (chosen)', 'Spinner.Region static', 'region flag on Spinner']
