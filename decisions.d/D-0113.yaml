id: D-0113
date: 2026-11-08
area: api
decided_by: agent (pds1-ds-architect) at G3, owner may switch
decision: 'The discreet Change photo corner icon (CTM#240, PLX-027) is AvatarUpload actions="corner" (ADR 0034): one icon-only photo_camera button at the bottom-end corner, ringed in the surface color, always in the tab order, named and tooltipped by strings.change / strings.add, quiet at rest and full on hover and focus; it opens the file and crop flow, or a Change / Remove menu when there is a picture; size gains "lg" with corner only; Avatar gets no action prop; no new strings.'
why: 'AvatarUpload already owns the file, crop and remove flow and its words; a button inside Avatar (an image) is invalid and makes each app rewire the flow.'
options: ['AvatarUpload actions="corner" (chosen)', 'Avatar action={{ icon, label, onPress }}', 'a new AvatarEditButton part']
status: active
check: 'G3 API diff on the build PR; check-system token-tiers (check 6), token-names (check 7); planned:avatar-upload-corner-977 behavior test (keyboard and pointer open the flow, accessible name, tab order, 24px target, bottom-end in LTR and RTL)'
