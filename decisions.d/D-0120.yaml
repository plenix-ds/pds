decision: 'EntityHeader toned fact (#990, D-0118): inside a toned tile the fact''s icon takes the tone text colour and its icon tile takes the tone border (fill unchanged); the embedded picker uses the existing invalid field look only with tone danger, never when disabled, and keeps the existing invalid-over-focus border with no extra ring; the "required, not chosen" hint is visually hidden, read through aria-describedby; toned and untoned tiles are the same size.'
