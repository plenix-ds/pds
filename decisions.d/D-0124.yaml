id: D-0124
date: 2026-11-08
area: api
decided_by: agent (pds1-ds-architect) at G3, owner may switch
decision: 'A back-to-parent item in a side pane is SecondaryPane back={ parent, href | onClick } (ADR 0038): the first row above the title, start-aligned, quiet, the arrow on the nav icon column and mirrored in RTL, text from the existing strings.back ("Back to {name}"); in the folded rail an icon with a tooltip; the pane title is the strongest text (back < title > section headings > items).'
why: 'The pane owns its header and rail, so only it can put the back item above the title and in the folded rail; reusing strings.back keeps one Back in Plenix and adds no words.'
options: ['SecondaryPane back prop (chosen)', 'NavList.Back or a back prop on NavList']
status: active
check: 'G3 API diff on the build PR; check-system token-tiers (check 6), token-names (check 7); planned:secondary-pane-back-995 behavior tests (order, name, link or button, RTL mirror, rail tooltip, title hierarchy)'
