decision: 'Panel toggleOn?: "button" | "header" (default "button"; ADR 0041): with "header" a pointer click anywhere on a collapsible panel''s header toggles it, except on actions, interactive children and text selection; the button stays the one focusable, accessible target (aria-expanded); new comp token panel-toggle-pressed-background -> state-pressed and class plx-panel--toggle-header.'
why: 'Apps (CTM) attach click handlers to Plenix internal classes to get the Fluent accordion behaviour; an enum opt-in keeps today''s default and can grow.'
options: ['toggleOn enum (chosen)', 'headerToggles boolean']
status: active
