decision: 'CommandBar actions[].confirm.plural takes a string or a plural object in the catalog''s own shape (Intl.PluralRules categories with other required, plus exact "=N" keys); the count picks the form with the page language''s plural rules, an exact key wins, and a plain string works as before (docs/adr/0004 addendum).'
why: 'One plural string cannot agree with every count (Arabic has six forms); reusing the catalog''s shape keeps one plural model across Plenix.'
options: [string or the catalog's plural object (chosen, A), a plural callback (count) => string, string only]
