id: D-0159
date: 2026-11-10
area: design
decided_by: design-director (reading of D-0158, the owner's 10-second stage, #1194)
decision: 'At 10 s a LoadingState keeps its label and adds a second line ("This is taking longer than usual.", body, content-muted) and, with onCancel, a size sm Cancel button; with progress, only Cancel is added. Focus is not moved; the second line is its own polite status (docs/pds1/slices/1194/design.md).'
options: ['A: keep the label, add a second line; Cancel also with progress (chosen)', 'B: replace the label with a "Still {label}" pattern; nothing new with progress']
why: 'One app-independent string instead of a second label per app (no string composition, so Arabic word order holds); a request that can be aborted keeps its Cancel whether or not progress is known, as LoadingOverlay does.'
status: active
check: 'planned:tests on 1194 (second line and Cancel at 10 s, Cancel with progress, focus unchanged)'
