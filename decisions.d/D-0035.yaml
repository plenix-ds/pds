id: D-0035
date: 2026-11-05
area: process
decided_by: owner (2026-11-05, "yes" to the CTM 3.0 Product Lead's process change, pasted in the PDS1 Product Lead session)
decision: The owner's answer is final. Agents pick the sensible reading, act on it and say in one line on the thread how they read it; an answer never produces a new question card. All pending owner answers are handled in one pass, and the dashboard is refreshed once at the end. Threads use plain words, not decision-card jargon; the A/B options stay so the dashboard can show them.
why: 'In CTM, re-asking after answers (D-0032, D-0033) and one-by-one chains caused most of the delay; the owner approved the fix for PDS too.'
options: [answer is final, one pass, plain words (chosen), card for every unclear answer]
status: active
check: review-only (agent behaviour; pds1-delivery-lead checks it on decision issues)
