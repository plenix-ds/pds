decided_by: agent (pds1-ds-architect) at G3, owner may switch
decision: 'The read-only variation (D-0132) is variant: "tiles" on PropertyGroup (passed to its lists through an internal context) and on PropertyList (its own variant wins; an explicit layout wins over the variation with a devWarn, per D-0134); tiles = stacked items on porcelain tiles, two per row, one per row when narrow; PropertyList.Item.status { label, tone, icon (required) } draws the value as a Badge with its icon. Default stays "default" (layout columns, D-0107). Tokens: sys size-field-tile-min -> ref size-60u; comp property-list-tiles-min-inline-size, property-list-tiles-gap -> space-stack-field (ADR 0044).'
why: 'One name sets the whole look so apps cannot miss it (CTM#273), matching Timeline''s variant precedent (D-0115); "tiles" is the word D-0106 and DESIGN.md use, and layout keeps one meaning.'
options: ['variant "tiles" on PropertyGroup and PropertyList (chosen)', 'layout "tiles" on PropertyList only', 'variant "read-only"']
status: active
check: 'G3 API diff on the build PR; check-system token-tiers (check 6), token-names (check 7); planned:property-tiles-1043 tests (AC-1..AC-6); check 12 baselines light, dark, RTL, compact'
