id: D-0034
date: 2026-11-05
area: process
decided_by: agent (pds1-product-lead) from the owner's request, owner may switch
decision: The PDS dashboard is built like the CTM 3.0 dashboard - an interactive dashboard (Overview, To decide, To do, Decisions, Done, Checks, Team, Screenshots) where the owner answers decisions in place with his own fine-grained key (plenix-ds/pds, Issues read and write only). The generated read-only page of plan §6a follows as P2. Replaces the read-only-only part of plan §6a (change proposed on an issue, because the plan is protected).
why: 'The owner showed the CTM 3.0 dashboard (2026-11-05) after asking whether PDS has a dashboard like it.'
options: [like CTM plus the §6a page later (chosen), like CTM only, the §6a read-only page only]
status: active
check: review-only (until the dashboard exists; then the brief's AC-1 to AC-6 in docs/pds1/slices/195-dashboard/brief.md)
