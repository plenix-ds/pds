decision: 'Timeline variant="grouped" (ADR 0036): year groups from items[].dateTime in the given order, events in category-tinted containers, a calendar date icon, upcoming events dashed with Pending, an optional legend (legend, hiddenCategories, onHiddenCategoriesChange); items carry category { id, label, color } and upcoming. category-1..8 are sys -> sys aliases of existing category hues (1 magenta, 2 gray, 3 teal, 4 purple, 5 orange, 6 navy, 7 green, 8 yellow), data-plx-category="1".."8"; a coloured container reads them per theme (G2 #992: light soft / soft-border / on-soft; dark soft-border mixed 5% and 35% into surface-default, title soft-border) through per-theme slots (dark: soft and soft-border = surface-default, on-soft = the hue soft-border) and token-only color-mix amounts category-tint-amount (0% / 5%) and category-tint-border-amount (0% / 35%) (new refs mix-amount-none, -2xs, -lg); content-decorative (gray-200 / gray-700) for the watermark; space-stack-3xl (new ref space-20u, compact space-16u); no new colour refs. New strings timeline.pending and timeline.legend.'
why: 'The 21-hue pill palette covers CTM''s eight colours; it keeps light tints in dark mode, which glares on containers, so containers read it per theme through token-only mixes (G2 measured >= 4.67:1).'
options: ['slots aliasing existing hues, read per theme by a token-only container mix, variant="grouped" (chosen)', 'apps use hue names directly, no slots', 'new refs for plum, copper, slate, gold']
