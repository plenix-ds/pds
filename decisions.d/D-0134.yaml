decision: 'Read-only tiles variation (D-0132, #1043): variant="tiles" on PropertyGroup reaches its PropertyList; an explicit layout on that list wins, with a dev warning; it adds no CSS values of its own (it reuses the stacked classes); a status value is an existing Badge with its icon passed as the value; loading uses LoadingState (D-0130), not Skeleton.'
why: 'The owner asked for the D-0106 look as one named variation; reusing the stacked roles keeps one source of values, and an explicit prop winning is the least surprising rule for apps already on layout="stacked".'
options: ['A explicit layout wins, with a warning (chosen)', 'B the variation always wins']
