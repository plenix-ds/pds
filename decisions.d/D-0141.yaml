id: D-0141
date: 2026-11-09
area: design
decided_by: owner asked for the corner icon (chat, 2026-11-09 ~02:00 UTC, #1122); agent (pds1-design-director) at G2 applied reading A, owner may switch
decision: 'Long text (#1122, look for ADR 0047 / D-0140): cut text in a box (a read-only tile, a card or Panel body, a DataGrid cell) shows a ghost 2xs icon-only button (expand glyph) at the inline-end, block-end corner while it is cut, and it opens the full text in a Dialog titled with the label; in a grid it shows on row hover and cell focus, and F2 opens it on a read-only cut cell. One behaviour in 1.4.0: no in-place expansion. Clamping stays opt-in (a read-only value is never cut unless the app sets lines), and Text expandable keeps Show more under prose.'
why: 'The owner described the corner icon and allowed in place or a dialog; one behaviour matches ADR 0047, and opt-in keeps the D-0106 rule that a read-only value is never cut, so no existing screen changes without the app asking.'
options: ['A. Dialog only, opt-in clamp, Show more kept for prose (chosen)', 'B1. short text unfolds in place (adds "expand")', 'B2. read-only values clamp to 3 lines by default', 'B3. the corner icon replaces Show more everywhere']
status: active
check: 'G2 on the build PR against docs/pds1/slices/1122/design.md; planned:long-text-corner tests (design §7); check 12 specimen long-text-corner'
